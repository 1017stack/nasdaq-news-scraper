services:
  - type: web
    name: nasdaq-frontend
    runtime: static
    buildCommand: |
      sed -i "s|window.API_URL|'https://nasdaq-backend.onrender.com'|g" index.html
    staticPublishPath: ./frontend
    envVars:
      - key: API_URL
        value: https://nasdaq-backend.onrender.com

  - type: web
    name: nasdaq-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nasdaq-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: ENABLE_NOTIFICATIONS
        value: "true"
      - key: SEC_USER_AGENT
        value: "NASDAQ-News-Scraper/1.0"
    healthCheckPath: /

  - type: worker
    name: nasdaq-scraper
    runtime: docker
    dockerfilePath: ./scrapers/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nasdaq-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: ENABLE_NOTIFICATIONS
        value: "true"
      - key: SEC_USER_AGENT
        value: "NASDAQ-News-Scraper/1.0"
      - key: REDDIT_USER_AGENT
        value: "NASDAQ-News-Scraper/1.0"

databases:
  - name: nasdaq-db
    databaseName: nasdaq_news
    user: nasdaq_user
    plan: free
