version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nasdaq_user
      POSTGRES_PASSWORD: nasdaq_pass
      POSTGRES_DB: nasdaq_news
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nasdaq_user -d nasdaq_news"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - DATABASE_URL=postgresql://nasdaq_user:nasdaq_pass@postgres:5432/nasdaq_news
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL}
      - NOTIFICATION_EMAIL_RECIPIENTS=${NOTIFICATION_EMAIL_RECIPIENTS}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - NOTIFICATION_SMS_RECIPIENTS=${NOTIFICATION_SMS_RECIPIENTS}
      - ENABLE_NOTIFICATIONS=${ENABLE_NOTIFICATIONS:-true}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  scraper:
    build:
      context: .
      dockerfile: scrapers/Dockerfile
    environment:
      - DATABASE_URL=postgresql://nasdaq_user:nasdaq_pass@postgres:5432/nasdaq_news
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL}
      - NOTIFICATION_EMAIL_RECIPIENTS=${NOTIFICATION_EMAIL_RECIPIENTS}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - NOTIFICATION_SMS_RECIPIENTS=${NOTIFICATION_SMS_RECIPIENTS}
      - ENABLE_NOTIFICATIONS=${ENABLE_NOTIFICATIONS:-true}
      - SEC_USER_AGENT=${SEC_USER_AGENT:-NASDAQ-News-Scraper/1.0}
      - REDDIT_USER_AGENT=${REDDIT_USER_AGENT:-NASDAQ-News-Scraper/1.0}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
